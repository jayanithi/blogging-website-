<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            margin: 0;
        }

        .container {
            max-width: 650px;
            margin: 80px auto;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        input[type="file"] {
            background: white;
            color: black;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #8b5cf6, #06b6d4);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #ccc;
            text-decoration: none;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dbeafe;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Create New Post ✍️</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Post Title</label>
        <input type="text" name="title" placeholder="Post Title" required>

        <label>Post Content</label>
        <textarea name="content" rows="6" placeholder="Write your content..." required></textarea>

        <label>Upload Image</label>
        <input type="file" name="image">

        <button type="submit">Publish Post 🚀</button>
    </form>

    <a href="/posts/">← Back to Posts</a>
</div>

</body>
</html>
